{% load i18n %}
<div class="toast-container position-fixed top-0 end-0 p-3 mt-5"
     id="toast-messages-container"
     data-initial='{{ initial_messages_json }}'
     data-labels='{{ ui_labels_json }}'>
  <template id="toast-template">
    <div class="toast fade"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">
      <div class="toast-header border-0 py-2">
        {% include "includes/icon.html" with name="info-circle" extra="toast-icon me-2" %}
        <strong class="me-auto toast-title"></strong>
        <small class="text-muted toast-time"></small>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="toast"
                aria-label="{% translate 'Close' %}"></button>
      </div>
      <div class="toast-body pb-3"></div>
    </div>
  </template>
</div>
