<div class="modal modal-blur fade"
     id="{{ modal_id }}"
     tabindex="-1"
     aria-hidden="true"
     data-msg-success="{{ ui.msg_success }}"
     data-msg-error-prefix="{{ ui.msg_error_prefix }}"
     data-msg-network-error="{{ ui.msg_network_error }}">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ ui.title }}</h5>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <div class="mb-3">
          {% include "includes/icon.html" with name="alert-triangle" extra="text-danger icon-lg" %}
        </div>
        <h4 class="mb-2">
          {{ ui.record_label }}
          <span id="modal-object-id">
            {% if object_id %}
              {{ object_id }}
            {% else %}
              ---
            {% endif %}
          </span>
        </h4>
        <p class="text-secondary px-3 mb-0">
          {{ ui.question }}
          <span class="d-block mt-1 text-danger">
            <strong>{{ ui.warning_text }}</strong>
          </span>
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">
          {% include "includes/icon.html" with name="x" extra="me-2" %}
          {{ ui.cancel_btn }}
        </button>
        {% if mode == "api" %}
          <button type="button"
                  id="modal-confirm-action"
                  class="btn btn-danger">
            {% include "includes/icon.html" with name="trash" extra="me-2" %}
            {{ ui.confirm_btn }}
          </button>
        {% else %}
          <form id="modal-delete-form"
                method="post"
                action="{% if object_id %}{% url 'answers:delete' object_id %}{% endif %}"
                class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
              {% include "includes/icon.html" with name="trash" extra="me-2" %}
              {{ ui.confirm_btn }}
            </button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
</div>
