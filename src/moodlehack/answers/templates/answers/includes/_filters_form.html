{% load i18n %}
<div id="filter-form">
  <div class="mb-3">
    <label for="filter-category"
           class="form-label">{% translate "Category" %}</label>
    <select id="filter-category" name="category" class="form-select">
      <option value="">{% translate "All categories" %}</option>
      {% for cat in categories %}
        <option value="{{ cat.id }}"
                {% if request.GET.category == cat.id|stringformat:"i" %}
                  selected
                {% endif %}>
          {{ cat.name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="filter-status"
           class="form-label">{% translate "Status" %}</label>
    <select id="filter-status" name="status" class="form-select">
      <option value="">{% translate "All statuses" %}</option>
      {% for status_val, status_name in status_choices %}
        <option value="{{ status_val }}"
                {% if request.GET.status == status_val %}selected{% endif %}>
          {{ status_name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <hr class="my-3 opacity-25">
  <div class="row g-2 mb-3">
    <div class="col-6">
      <label for="filter-year"
             class="form-label">{% translate "Year" %}</label>
      <select id="filter-year" name="year" class="form-select">
        <option value="">{% translate "All" %}</option>
        {% for y_val, y_name in year_choices %}
          <option value="{{ y_val }}"
                  {% if request.GET.year == y_val|stringformat:"i" %}
                    selected
                  {% endif %}>
            {{ y_name }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6">
      <label for="filter-quarter"
             class="form-label">{% translate "Quarter" %}</label>
      <select id="filter-quarter" name="quarter" class="form-select">
        <option value="">{% translate "All" %}</option>
        <option value="1"
                {% if request.GET.quarter == "1" %}selected{% endif %}>Q1
        </option>
        <option value="2"
                {% if request.GET.quarter == "2" %}selected{% endif %}>Q2
        </option>
        <option value="3"
                {% if request.GET.quarter == "3" %}selected{% endif %}>Q3
        </option>
        <option value="4"
                {% if request.GET.quarter == "4" %}selected{% endif %}>Q4
        </option>
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label for="filter-month"
           class="form-label">{% translate "Month" %}</label>
    <select id="filter-month" name="month" class="form-select">
      <option value="">{% translate "All months" %}</option>
      {% for m_val, m_name in month_choices %}
        <option value="{{ m_val }}"
                {% if request.GET.month == m_val|stringformat:"i" %}
                  selected
                {% endif %}>
          {{ m_name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="d-grid gap-2 mt-4">
    <button type="submit" class="btn btn-primary">
      {% include "includes/icon.html" with name="circle-check" extra="me-1" %}
      {% translate "Apply" %}
    </button>
    <a href="{% url 'answers:index' %}" class="btn btn-ghost-secondary">
      {% include "includes/icon.html" with name="restore" extra="me-1" %}
      {% translate "Reset all" %}
    </a>
  </div>
</div>
