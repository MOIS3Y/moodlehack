[project]
name = "moodlehack"
version = "0.3.0rc1"
description = "Moodle test answers repo with fast search and REST API exchange"
readme = "README.md"
authors = [
    { name = "MOIS3Y", email = "stepan@zhukovsky.me" }
]
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "django-filter>=26.1",
    "django-typer>=4.1.0",
    "markdown>=3.10.3",
    "pydantic-settings>=2.15.0",
    "platformdirs>=4.11.12",
    "rich>=15.0.0",
    "starlette>=1.6.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
moodlehack = "moodlehack.manage:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
prerelease = "disallow"

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
]
