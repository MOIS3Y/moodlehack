name: Docker Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build Docker Image with Nix
        run: |
          nix build .#dockerImage
          # The result is a symlink to the tarball in the nix store
          cp result result.tar.gz

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to Docker Hub and GHCR
        shell: bash
        run: |
          docker load < result.tar.gz

          DOCKERHUB_IMAGE="mois3y/moodlehack"
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME#v}"

          docker tag "$DOCKERHUB_IMAGE:$TAG" "$GHCR_IMAGE:$TAG"

          for IMAGE in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            docker push "$IMAGE:$TAG"

            # Release candidates must not replace latest.
            if [[ "$TAG" != *rc* ]]; then
              docker tag "$IMAGE:$TAG" "$IMAGE:latest"
              docker push "$IMAGE:latest"
            fi
          done
